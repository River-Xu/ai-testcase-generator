[project]
name = "ai-testcase-generator"
version = "0.1.0"
description = "AI Testcase Generator (RAG-free) - generate structured testcases from requirements"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name="Your Name"}]
dependencies = [
  "openai>=1.40.0",
  "python-dotenv>=1.0.1",
  "pydantic>=2.7.0",
  "pandas>=2.2.0",
  "openpyxl>=3.1.2",
  "streamlit>=1.33.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
